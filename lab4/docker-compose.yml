# n8n + Redis для лабораторной №4 (Дусов, СПД ИИ-241)
# Запуск:   docker compose up -d        (из папки lab4)
# Редактор: http://localhost:5678
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-dusov
    ports:
      - "5678:5678"
    environment:
      - TZ=Europe/Minsk
      - GENERIC_TIMEZONE=Europe/Minsk
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false            # вход по http://localhost без HTTPS
      - N8N_RUNNERS_ENABLED=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - ./n8n-data:/home/node/.n8n         # база n8n, workflow, credentials
      - ./files:/data                      # папка для файлов (Read/Write Files)
    extra_hosts:
      - "host.docker.internal:host-gateway" # доступ к Redis на хосте
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
